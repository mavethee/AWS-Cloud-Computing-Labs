AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Wdrożenie architektury WAMP na AWS: Windows Server 2025 (EC2) połączony z RDS MySQL w dedykowanym VPC.
  Zawiera pełną automatyzację (UserData): instalacja XAMPP, konfiguracja OpenSSH oraz ustawienie hasła Administratora.
  Autor: Marcin Mitura.
Parameters:
  KeyName:
    Description: Nazwa pary kluczy EC2
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey

  DBPassword:
    Description: Hasło dla użytkownika root w bazie danych (RDS).
    Type: String
    NoEcho: true
    MinLength: 8
    Default: DBPassw0rd!

  AdminPassword:
    Description: Hasło dla konta Administrator w Windows Server.
    Type: String
    NoEcho: true
    MinLength: 8
    Default: WinAdminPass123!

  LatestWindowsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2025-English-Full-Base

Resources:
  # =========================================================
  # 1. SIEĆ (NETWORKING)
  # =========================================================

  VPCMarcinMitura:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 192.168.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: MarcinMituraVPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: MarcinMitura-IGW

  GatewayToInternet:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPCMarcinMitura
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCMarcinMitura
      Tags:
        - Key: Name
          Value: MarcinMitura-Public-RT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayToInternet
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCMarcinMitura
      CidrBlock: 192.168.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: MarcinMitura-Subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCMarcinMitura
      CidrBlock: 192.168.2.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: MarcinMitura-Subnet-2

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  MyDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Grupa podsieci
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  # =========================================================
  # 2. SECURITY GROUPS
  # =========================================================

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Dostep WWW (80), RDP (3389) i SSH (22)
      VpcId: !Ref VPCMarcinMitura
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Dostep do MySQL tylko z serwera Windows
      VpcId: !Ref VPCMarcinMitura
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !GetAtt WebServerSecurityGroup.GroupId

  # =========================================================
  # 3. BAZA DANYCH RDS
  # =========================================================
  MySQLDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 20
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: '8.0'
      MasterUsername: root
      MasterUserPassword: !Ref DBPassword
      DBName: projekt
      VPCSecurityGroups:
        - !GetAtt DBSecurityGroup.GroupId
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      PubliclyAccessible: false
      StorageType: gp2
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true

  # =========================================================
  # 4. SERWER WINDOWS (EC2) Z XAMPP + HASŁO ADMINA
  # =========================================================
  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      ImageId: !Ref LatestWindowsAmiId
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !GetAtt WebServerSecurityGroup.GroupId
      UserData: !Base64
        Fn::Sub:
          - |
            <powershell>
            # --- 0. USTAWIANIE HASŁA ADMINISTRATORA ---
            # To pozwoli Ci zalogować się przez RDP bez czekania na "Get Password" w konsoli
            Set-LocalUser -Name "Administrator" -Password (ConvertTo-SecureString "${AdminPassword}" -AsPlainText -Force)

            # --- 1. SETUP SYSTEMU ---
            New-ItemProperty -Path HKCU:\Software\Microsoft\ServerManager -Name DoNotOpenServerManagerAtLogon -Value 1 -Force
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
            Start-Service sshd
            Set-Service -Name sshd -StartupType 'Automatic'

            # Firewall
            New-NetFirewallRule -DisplayName "Allow HTTP Port 80" -Direction Inbound -LocalPort 80 -Protocol TCP -Action Allow
            New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (sshd)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
            New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -PropertyType String -Force

            # --- 2. INSTALACJA XAMPP ---
            $xamppUrl = "https://sourceforge.net/projects/xampp/files/XAMPP%20Windows/8.2.12/xampp-windows-x64-8.2.12-0-VS16-installer.exe/download"
            $installerPath = "C:\xampp-installer.exe"

            Write-Host "Pobieranie XAMPP..."
            Invoke-WebRequest -Uri $xamppUrl -OutFile $installerPath -UserAgent "NativeHost"

            Write-Host "Instalacja XAMPP..."
            $proc = Start-Process -FilePath $installerPath -ArgumentList "--mode unattended", "--disable-components xampp_tomcat,xampp_mercury,xampp_filezilla,xampp_perl" -PassThru -Wait

            Write-Host "Usluga Apache..."
            & "C:\xampp\apache\apache_installservice.bat"
            Start-Service Apache2.4

            # --- 3. SKRYPT BAZY DANYCH ---
            $setupContent = @"
            <?php
            mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
            `$host = '${RDSEndpoint}';
            `$user = 'root';
            `$pass = '${DBPassword}';
            try {
                `$conn = new mysqli(`$host, `$user, `$pass);
                echo 'Polaczono z RDS w MarcinMituraVPC! Instaluje...<br>';
                `$sql = "CREATE DATABASE IF NOT EXISTS projekt; USE projekt; CREATE USER IF NOT EXISTS 'app_user'@'%' IDENTIFIED BY 'TajneHasloAplikacji'; GRANT SELECT, INSERT, UPDATE, DELETE ON projekt.* TO 'app_user'@'%'; FLUSH PRIVILEGES; DROP TABLE IF EXISTS osoby; CREATE TABLE osoby (id INT AUTO_INCREMENT PRIMARY KEY, imie VARCHAR(50) NOT NULL, nazwisko VARCHAR(50) NOT NULL, miasto VARCHAR(50) NOT NULL, owner_id VARCHAR(255) NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP); INSERT INTO osoby (imie, nazwisko, miasto, owner_id) VALUES ('Jan', 'Kowalski', 'Warszawa', 'admin'), ('Anna', 'Nowak', 'Gdańsk', 'admin');";
                if (`$conn->multi_query(`$sql)) { echo '<h1 style=\'color:green\'>BAZA GOTOWA!</h1>'; }
            } catch (Exception `$e) { echo 'Blad: ' . `$e->getMessage(); }
            ?>
            "@
            Set-Content -Path "C:\xampp\htdocs\setup.php" -Value $setupContent
            Remove-Item "C:\xampp\htdocs\index.php" -ErrorAction SilentlyContinue
            </powershell>
          - RDSEndpoint: !GetAtt MySQLDatabase.Endpoint.Address
            DBPassword: !Ref DBPassword
            AdminPassword: !Ref AdminPassword # Przekazanie parametru do UserData

Outputs:
  VPCId:
    Description: ID Twojego VPC
    Value: !Ref VPCMarcinMitura

  WebsiteURL:
    Description: Link instalacyjny (Poczekaj 10 min!)
    Value: !Sub http://${WebServerInstance.PublicDnsName}/setup.php

  WebsiteIndex:
    Description: Glowna strona
    Value: !Sub http://${WebServerInstance.PublicDnsName}/index.php

  RDSEndpoint:
    Description: Host bazy danych
    Value: !GetAtt MySQLDatabase.Endpoint.Address

  InstanceId:
    Description: ID instancji
    Value: !Ref WebServerInstance

  SCPCommand:
    Description: Komenda do wgrania plików
    Value: !Sub scp -i ${KeyName}.pem -r WebForm/*
      Administrator@${WebServerInstance.PublicIp}:C:/xampp/htdocs/

  RDPLoginInfo:
    Description: Użyj tego hasła do logowania RDP (Administrator)
    Value: !Ref AdminPassword