AWSTemplateFormatVersion: 2010-09-09
Description: |
  Production-ready AWS CloudFormation template for a Load Balanced Windows Web Environment.
  This stack deploys a custom VPC, Multi-AZ public subnets, an Application Load Balancer (ALB),
  and two Windows Server 2025 instances. Includes automated IIS bootstrapping via User Data
  and comprehensive Security Group configuration for HTTP/RDP access.
  Author: Marcin Mitura.

Parameters:
  KeyName:
    Description: Nazwa klucza (np. vockey).
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey

  AdminPassword:
    Description: Haslo dla konta Administrator.
    Type: String
    NoEcho: true
    MinLength: 8
    Default: P@ssw0rd!

  WindowsVersion:
    Type: String
    Default: Windows_Server-2025-English-Full-Base
    AllowedValues:
      - Windows_Server-2025-English-Full-Base
      - Windows_Server-2022-English-Full-Base
    Description: Wersja systemu Windows Server.

Resources:
  # --- 1. SIEC (VPC) ---
  VPCMarcinMitura:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 192.168.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: VPCMarcinMitura
        - Key: vpc
          Value: attached

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Lab-IGW
        - Key: vpc
          Value: attached

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPCMarcinMitura
      InternetGatewayId: !Ref InternetGateway

  # --- 2. PODSIECI (Publiczne w roznych strefach) ---
  SubnetMM1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCMarcinMitura
      CidrBlock: 192.168.100.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: SubnetMM1
        - Key: vpc
          Value: attached

  SubnetMM2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCMarcinMitura
      CidrBlock: 192.168.200.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: SubnetMM2
        - Key: vpc
          Value: attached

  # --- 3. ROUTING ---
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCMarcinMitura
      Tags:
        - Key: Name
          Value: Lab-Public-RT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetMM1
      RouteTableId: !Ref PublicRouteTable

  Subnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetMM2
      RouteTableId: !Ref PublicRouteTable

  # --- 4. SECURITY GROUP (RDP + HTTP) ---
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDP and HTTP Access
      VpcId: !Ref VPCMarcinMitura
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SG-Web-MM

  # --- 5. LOAD BALANCER (ALB) ---
  ALB1:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: Lab-ALB-MM
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref SubnetMM1
        - !Ref SubnetMM2
      SecurityGroups:
        - !Ref WebSecurityGroup
      Tags:
        - Key: Name
          Value: ALB-MM

  # --- 6. TARGET GROUP (Z POPRAWKA) ---
  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: Lab-TargetGroup-MM
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPCMarcinMitura
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 60 # Dłuższy czas dla Windowsa
      Matcher:
        HttpCode: 200
      # Tutaj definiujemy cele (Targets) zamiast uzywac TargetGroupAttachment
      Targets:
        - Id: !Ref WWW1
          Port: 80
        - Id: !Ref WWW2
          Port: 80

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB1
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # --- 7. INSTANCJE WINDOWS SERVER 2025 ---

  # Serwer 1
  WWW1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      # Dynamiczne pobieranie Windows Server 2025 Base
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-windows-latest/${WindowsVersion}}}'
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref WebSecurityGroup
          SubnetId: !Ref SubnetMM1

      # UserData (PowerShell) - Instalacja IIS
      UserData: !Base64
        Fn::Sub: |
          <powershell>
          # 1. Ustawienie hasla (uzywamy parametru z gory pliku)
          Set-LocalUser -Name "Administrator" -Password (ConvertTo-SecureString "${AdminPassword}" -AsPlainText -Force)

          # 2. Otwarcie portow w Firewallu Windowsa (wewnatrz systemu)
          New-NetFirewallRule -DisplayName "HTTP" -Direction Inbound -LocalPort 80 -Protocol TCP -Action Allow
          New-NetFirewallRule -DisplayName "HTTPS" -Direction Inbound -LocalPort 443 -Protocol TCP -Action Allow

          Install-WindowsFeature -Name "Web-Server" -IncludeManagementTools
          Set-Content -Path "C:\inetpub\wwwroot\index.html" -Value '<!DOCTYPE html><html><head><title>MM</title></head><body><h1>Marcin Mitura - SERWER 1 (Windows Server 2025)</h1></body></html>'
          Start-Service W3SVC
          </powershell>

      Tags:
        - Key: Name
          Value: WWW1-MM

  # Serwer 2
  WWW2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      # Dynamiczne pobieranie Windows Server 2025 Base
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-windows-latest/${WindowsVersion}}}'
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref WebSecurityGroup
          SubnetId: !Ref SubnetMM2

      UserData: !Base64
        Fn::Sub: |
          <powershell>
          Set-LocalUser -Name "Administrator" -Password (ConvertTo-SecureString "${AdminPassword}" -AsPlainText -Force)
          New-NetFirewallRule -DisplayName "HTTP" -Direction Inbound -LocalPort 80 -Protocol TCP -Action Allow

          Install-WindowsFeature -Name "Web-Server" -IncludeManagementTools
          Set-Content -Path "C:\inetpub\wwwroot\index.html" -Value '<!DOCTYPE html><html><head><title>MM</title></head><body><h1>Marcin Mitura - SERWER 2 (Windows Server 2025)</h1></body></html>'
          Start-Service W3SVC
          </powershell>
      Tags:
        - Key: Name
          Value: WWW2-MM

# --- 8. OUTPUTS ---
Outputs:
  LoadBalancerDNS:
    Description: Adres strony WWW (Load Balancer)
    Value: !Sub http://${ALB1.DNSName}

  Server1IP:
    Description: IP Serwera 1 (Windows)
    Value: !GetAtt WWW1.PublicIp

  Server2IP:
    Description: IP Serwera 2 (Windows)
    Value: !GetAtt WWW2.PublicIp

  ConnectCommand1:
    Description: RDP do Serwera 1
    Value: !Sub mstsc /v:${WWW1.PublicIp}

  ConnectCommand2:
    Description: RDP do Serwera 2
    Value: !Sub mstsc /v:${WWW2.PublicIp}