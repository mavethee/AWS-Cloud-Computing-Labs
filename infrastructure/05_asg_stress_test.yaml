AWSTemplateFormatVersion: 2010-09-09
Description: |
  Advanced AWS CloudFormation template for a High Availability Windows Server 2025 environment.
  This stack provisions a Multi-AZ Auto Scaling Group (ASG) with Application Load Balancer (ALB) integration.
  It features a custom Launch Template with embedded User Data logic (PowerShell) to perform automated stress testing
  based on IP parity, triggering Target Tracking Scaling Policies (CPU > 15%).
  Author: Marcin Mitura.

Parameters:
  KeyName:
    Description: Nazwa klucza SSH/RDP (np. vockey).
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey

  AdminPassword:
    Description: Hasło dla konta Administrator.
    Type: String
    NoEcho: true
    MinLength: 8
    Default: P@ssw0rd!

  WindowsVersion:
    Type: String
    Default: Windows_Server-2025-English-Full-Base
    AllowedValues:
      - Windows_Server-2025-English-Full-Base
      - Windows_Server-2022-English-Full-Base
    Description: Wersja systemu Windows Server.

  DesiredCapacity:
    Type: Number
    Default: 2
    Description: Startowa liczba instancji.
    MinValue: 1
    MaxValue: 10

  MaxSize:
    Type: Number
    Default: 4
    Description: Maksymalna liczba instancji.
    MinValue: 1
    MaxValue: 10

  MinSize:
    Type: Number
    Default: 1
    Description: Minimalna liczba instancji.
    MinValue: 1
    MaxValue: 10

Resources:
  # --- 1. SIEĆ ---
  MarcinMituraVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 192.168.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: MarcinMituraVPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: MarcinMitura-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MarcinMituraVPC
      InternetGatewayId: !Ref InternetGateway

  # --- 2. PODSIECI ---
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MarcinMituraVPC
      CidrBlock: 192.168.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: MarcinMitura-Public-Subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MarcinMituraVPC
      CidrBlock: 192.168.2.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: MarcinMitura-Public-Subnet-2

  # --- 3. ROUTING ---
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MarcinMituraVPC
      Tags:
        - Key: Name
          Value: MarcinMitura-Public-RT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # --- 4. SECURITY GROUP ---
  WindowsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Zezwalaj na RDP, HTTP i HTTPS
      VpcId: !Ref MarcinMituraVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
          Description: RDP Access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP Access (ALB)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS Access
      Tags:
        - Key: Name
          Value: MarcinMitura-SG

  # --- 5. LOAD BALANCER ---
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: MarcinMitura-ALB
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref WindowsSecurityGroup
      Tags:
        - Key: Name
          Value: MarcinMitura-ALB

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: MarcinMitura-TG
      Port: 80
      Protocol: HTTP
      VpcId: !Ref MarcinMituraVPC
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'false'
      Tags:
        - Key: Name
          Value: MarcinMitura-TG

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # --- 6. LAUNCH TEMPLATE ---
  WindowsLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: MarcinMitura-Windows-Template
      LaunchTemplateData:
        ImageId: !Sub '{{resolve:ssm:/aws/service/ami-windows-latest/${WindowsVersion}}}'
        InstanceType: t3.small
        KeyName: !Ref KeyName
        SecurityGroupIds:
          - !Ref WindowsSecurityGroup
        Monitoring:
          Enabled: true
        UserData: !Base64
          Fn::Sub: |
            <powershell>
            # 1. Konfiguracja podstawowa
            Set-LocalUser -Name "Administrator" -Password (ConvertTo-SecureString "${AdminPassword}" -AsPlainText -Force)
            New-NetFirewallRule -DisplayName "Allow HTTP 80" -Direction Inbound -LocalPort 80 -Protocol TCP -Action Allow -Profile Any
            New-NetFirewallRule -DisplayName "Allow HTTPS 443" -Direction Inbound -LocalPort 443 -Protocol TCP -Action Allow -Profile Any
            New-NetFirewallRule -DisplayName "Allow RDP 3389" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -Profile Any

            # 2. Instalacja IIS
            Install-WindowsFeature -Name "Web-Server" -IncludeManagementTools
            Remove-Item -Path "C:\inetpub\wwwroot\iisstart.htm" -Force -ErrorAction SilentlyContinue

            $hostname = $env:computername
            $myIP = (Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias Ethernet*).IPAddress

            # --- STYLE CSS ---
            $css = @"
            <style>
              body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ecf0f1; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
              .card { background: white; width: 100%; max-width: 450px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
              .card-header { padding: 25px; color: white; }
              .card-body { padding: 30px; color: #2c3e50; }

              /* Kolory statusow */
              .status-wait { background: linear-gradient(135deg, #3498db, #2980b9); }
              .status-stress { background: linear-gradient(135deg, #e74c3c, #c0392b); }
              .status-idle { background: linear-gradient(135deg, #2ecc71, #27ae60); }

              h1 { margin: 0; font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
              h2 { margin: 5px 0 0; font-size: 13px; opacity: 0.9; font-weight: 400; }

              .metric-box { background: #f8f9fa; border-radius: 8px; padding: 15px; margin: 20px 0; text-align: left; border: 1px solid #e9ecef; }
              .metric-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
              .metric-label { color: #7f8c8d; font-weight: 500; }
              .metric-value { color: #2c3e50; font-weight: 700; }

              .badge { display: inline-block; padding: 5px 12px; border-radius: 50px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
              .badge-wait { background: #d6eaf8; color: #2980b9; }
              .badge-stress { background: #fadbd8; color: #c0392b; }
              .badge-idle { background: #d5f5e3; color: #27ae60; }

              .spinner { margin: 20px auto; width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
              @keyframes spin { to { transform: rotate(360deg); } }
            </style>
            "@

            # --- STRONA STARTOWA (Oczekiwanie 300s) ---
            $htmlContent = @"
            <!DOCTYPE html><html><head><meta charset="utf-8"><title>ALB & Auto Scaling - Marcin Mitura</title>$css</head>
            <body>
              <div class="card">
                <div class="card-header status-wait">
                  <div class="spinner"></div>
                  <h1>ALB & Auto Scaling</h1>
                  <h2>Autor: Marcin Mitura</h2>
                </div>
                <div class="card-body">
                  <span class="badge badge-wait">Status: Inicjalizacja</span>
                  <div class="metric-box">
                    <div class="metric-row"><span class="metric-label">Nazwa hosta:</span><span class="metric-value">$hostname</span></div>
                    <div class="metric-row"><span class="metric-label">Prywatny adres IP:</span><span class="metric-value">$myIP</span></div>
                    <div class="metric-row"><span class="metric-label">Srodowisko:</span><span class="metric-value">AWS Cloud</span></div>
                  </div>
                  <p style="font-size: 13px; color: #95a5a6;">300s do startu stress testu od startu instacji.</p>
                </div>
              </div>
            </body></html>
            "@
            Set-Content -Path "C:\inetpub\wwwroot\index.html" -Value $htmlContent
            Start-Service W3SVC

            # 3. --- LOGIKA TESTOWA ---
            $StressScript = @"

            Write-Host "Czekam 300s na stabilizacje..."
            Start-Sleep -Seconds 300

            `$ip = (Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias Ethernet*).IPAddress
            `$lastOctet = [int](`$ip.Split('.')[-1])

            `$hostNameInner = `$env:computername
            `$myIPInner = `$ip
            `$css = '$css'

            if (`$lastOctet % 2 -eq 0) {
                # --- SCENARIUSZ: STRESS TEST (parzysty adres IP) ---
                `$htmlContent = @"
                <!DOCTYPE html><html><head><meta charset="utf-8"><title>)</title>`$css</head>
                <body>
                  <div class="card">
                    <div class="card-header status-stress">
                      <h1>Laboratorium ALB & Auto Scaling</h1>
                      <h2>Autor: Marcin Mitura</h2>
                    </div>
                    <div class="card-body">
                      <span class="badge badge-stress">CPU: ~30% (Atak)</span>
                      <div class="metric-box">
                        <div class="metric-row"><span class="metric-label">Nazwa hosta:</span><span class="metric-value">`$hostNameInner</span></div>
                        <div class="metric-row"><span class="metric-label">Prywatny adres IP:</span><span class="metric-value">`$myIPInner</span></div>
                        <div class="metric-row"><span class="metric-label">Warunek:</span><span class="metric-value">IP PARZYSTE</span></div>
                      </div>
                      <p style="font-size: 13px; color: #95a5a6;">Generowanie obciazenia do wymuszenia skalowania.</p>
                    </div>
                  </div>
                </body></html>
                "@
                Set-Content -Path "C:\inetpub\wwwroot\index.html" -Value `$htmlContent

                while (`$true) {
                    1..3000 | ForEach-Object { `$result = [Math]::Sqrt(`$_) * [Math]::Tan(`$_) }
                    Start-Sleep -Milliseconds 100
                }
            } else {
                # --- SCENARIUSZ: Brak testu (nieparzysty adres IP) ---
                `$htmlContent = @"
                <!DOCTYPE html><html><head><meta charset="utf-8"><title>ALB & Auto Scaling - Marcin Mitura (Bezpieczna)</title>`$css</head>
                <body>
                  <div class="card">
                    <div class="card-header status-idle">
                      <h1>Laboratorium ALB & Auto Scaling</h1>
                      <h2>Autor: Marcin Mitura</h2>
                    </div>
                    <div class="card-body">
                      <span class="badge badge-idle">CPU: 0% (Idle)</span>
                      <div class="metric-box">
                        <div class="metric-row"><span class="metric-label">Nazwa Hosta:</span><span class="metric-value">`$hostNameInner</span></div>
                        <div class="metric-row"><span class="metric-label">Prywatny adres IP:</span><span class="metric-value">`$myIPInner</span></div>
                        <div class="metric-row"><span class="metric-label">Warunek:</span><span class="metric-value">IP NIEPARZYSTE</span></div>
                      </div>
                      <p style="font-size: 13px; color: #95a5a6;">Instancja zdrowa, obsluguje ruch.</p>
                    </div>
                  </div>
                </body></html>
                "@
                Set-Content -Path "C:\inetpub\wwwroot\index.html" -Value `$htmlContent

                while (`$true) {
                    Start-Sleep -Seconds 60
                }
            }
            "@

            Set-Content -Path "C:\LabLogic.ps1" -Value $StressScript
            Start-Job -ScriptBlock { & "C:\LabLogic.ps1" }
            Start-Job -ScriptBlock { & "C:\LabLogic.ps1" }

            </powershell>
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: MarcinMitura-ALB-Instance
              - Key: Owner
                Value: MarcinMitura

  # --- 7. AUTO SCALING GROUP ---
  WindowsAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: MarcinMitura-ASG
      LaunchTemplate:
        LaunchTemplateId: !Ref WindowsLaunchTemplate
        Version: !GetAtt WindowsLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: MarcinMitura-ASG-Instance
          PropagateAtLaunch: true

  # --- 8. SCALING POLICIES ---
  ScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WindowsAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        # CEL 15% - Aby wymusic skalowanie przy lekkim stresie
        TargetValue: 15

  # --- 9. DASHBOARD ---
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: MarcinMitura-Lab-Dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [ [ "AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${WindowsAutoScalingGroup}", { "period": 60, "stat": "Average" } ] ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Srednie CPU (Cel > 15%)",
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                    [ "AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${WindowsAutoScalingGroup}", { "period": 60, "stat": "Average", "color": "#d62728" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Liczba Instancji",
                "yAxis": { "left": { "min": 0, "max": 5 } }
              }
            }
          ]
        }

# --- 10. OUTPUTS ---
Outputs:
  LoadBalancerURL:
    Description: Adres strony WWW (Poczekaj 5 min na start)
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}

  DashboardURL:
    Description: Link do Monitoringu CloudWatch
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=MarcinMitura-Lab-Dashboard

  VPCId:
    Value: !Ref MarcinMituraVPC